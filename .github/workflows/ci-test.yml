# CI runs on Node.js 26.x
name: CI Test

on:
  # Tests run only by hand (Actions → CI Test → Run workflow) to save CI minutes, by the user's decision of 2026-11-12.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # MyLocalTon makes a new network at first start (about a minute until healthy); ton-api starts after it
      - name: Start the TON network
        run: docker compose up -d --build --wait

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      # before the install: the lockfile resolves @ethberry dev packages from GitHub Packages
      - name: Authenticate GitHub Packages
        run: |
          echo "@ethberry:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=$GITHUBTOKEN" >> .npmrc
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}

      - name: Install Packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
